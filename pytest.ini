[pytest]
# Tests for the electros_ev custom integration.
#
#   python -m pytest                  full suite (needs requirements_test.txt, Python 3.13)
#   python -m pytest tests/test_protocol.py tests/test_tariff.py --noconftest
#                                     the stdlib-only modules, plain Python without Home Assistant
#   node dev/smoke.mjs                the Lovelace card (Node 22, no packages)
#
# `pythonpath = .` makes `custom_components` and `tests` importable. pytest applies it
# before plugins load, so the early plugin below can be imported.
testpaths = tests
pythonpath = .
# tests/windows_compat.py lets pytest-homeassistant-custom-component start on a
# Windows dev box (Home Assistant does not support Windows); it does nothing elsewhere.
addopts = -p tests.windows_compat
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
