<div style="width: 640px; height: 460px; display: flex; flex-direction: column; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

    <div style="position: relative; width: 170px; height: 170px; box-sizing: border-box; padding: 14px; border-radius: 30px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); color: #F5F5F7; display: flex; flex-direction: column; justify-content: space-between">

          <defs><linearGradient id="wr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#30D158"/></linearGradient></defs>
          <circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="9"/>
          <circle cx="46" cy="46" r="38" fill="none" stroke="url(#wr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="23.9" transform="rotate(-90 46 46)"/>

        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 24px; line-height: 26px; font-weight: 600; letter-spacing: -0.6px">7.4</span>

        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4CE07A">
          <span class="pulse" style="width: 8px; height: 8px; border-radius: 4px; background: #30D158"></span>
          <span>Заряджається</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 46px; line-height: 50px; font-weight: 600; letter-spacing: -1.4px; font-variant-numeric: tabular-nums">7.4</span>
          <span style="font-size: 17px; font-weight: 500; color: rgba(235,235,245,0.6)">кВт</span>

        <span style="font-size: 13px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums">до 21:45 · 4.2 кВт·год · 32 А</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">

        </button>
        <button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0; background: rgba(100,210,255,0.16); color: #64D2FF; font-size: 13px; font-weight: 600">+15 хв</button>
      </div>
    </div>
  </div>

  <div style="height: 230px; box-sizing: border-box; padding: 30px 40px; display: flex; gap: 24px; align-items: center; background: #F2F2F7; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 40px; top: -100px; width: 560px; height: 420px; background: radial-gradient(closest-side, rgba(88,86,214,0.16), transparent 72%)"></div>

    <div style="position: relative; width: 170px; height: 170px; box-sizing: border-box; padding: 14px; border-radius: 30px; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); color: #1C1C1E; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 600">ElectroS</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -0.4px">Чекаю авто</span>
        <span style="font-size: 13px; color: rgba(60,60,67,0.6)">кабель не підключено</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4745B8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <span style="font-variant-numeric: tabular-nums">23:00 → 07:00</span>
      </div>
    </div>

    <div style="position: relative; width: 360px; height: 170px; box-sizing: border-box; padding: 18px; border-radius: 30px; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); color: #1C1C1E; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4745B8">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <span>Чекає нічного тарифу</span>
        </div>
        <span style="font-size: 13px; color: rgba(60,60,67,0.6)">авто підключено</span>

      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -1.2px; font-variant-numeric: tabular-nums">23:00</span>
        <span style="font-size: 15px; color: rgba(60,60,67,0.6)">через 1 год 42 хв</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #34C759; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>
          <span>Зарядити 30 хв</span>
        </button>
        <button aria-label="Інший час" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(118,118,128,0.12); color: #1C1C1E; display: flex; align-items: center; justify-content: center; padding: 0">
