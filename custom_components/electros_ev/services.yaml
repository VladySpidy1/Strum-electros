charge_for:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: electros_ev
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    amps:
      required: false
      selector:
        number:
          min: 6
          max: 32
          step: 2
          mode: slider
          unit_of_measurement: A

extend_charge:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: electros_ev
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min

stop_charging:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: electros_ev

set_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: electros_ev
    start:
      required: false
      example: "23:00"
      selector:
        time:
    end:
      required: false
      example: "07:00"
      selector:
        time:
    enabled:
      required: false
      selector:
        boolean:
